<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Noise | Swiss Editorial Web Audio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #111111;
            --accent-color: #e5e5e5;
            --border-color: #111111;
        }
        
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .grid-container {
            border: 2px solid var(--border-color);
            background-color: var(--text-color);
            gap: 2px;
            display: flex;
            flex-direction: column;
        }

        .grid-cell {
            background-color: var(--bg-color);
        }

        .sound-btn {
            transition: background-color 0.1s ease, color 0.1s ease;
            position: relative;
            cursor: pointer;
            outline: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            text-align: left;
            padding: 1rem;
        }

        @media (min-width: 640px) {
            .sound-btn {
                padding: 1.5rem;
            }
        }

        .sound-btn:hover:not(.active) {
            background-color: var(--accent-color);
        }
        
        .sound-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
        
        .stop-btn:hover {
            background-color: #ff3333;
            color: white;
        }

        #visualizer-container {
            position: relative;
            width: 100%;
            height: 150px;
            background-color: var(--bg-color);
            border-bottom: 2px solid var(--border-color);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            #visualizer-container {
                height: 250px;
            }
        }

        #visualizer {
            display: block;
            width: 100%;
            height: 100%;
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.05));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body class="p-2 sm:p-4 md:p-8">

    <main class="flex-1 flex flex-col max-w-6xl mx-auto w-full grid-container shadow-2xl">
        
        <!-- Header -->
        <header class="p-4 sm:p-6 md:p-8 grid-cell flex justify-between items-end">
            <div>
                <h1 class="text-3xl sm:text-5xl md:text-6xl font-black tracking-tighter leading-none uppercase m-0 p-0">Nocturne</h1>
                <p class="text-xs sm:text-sm font-bold uppercase tracking-[0.2em] mt-2">Algorithmic Sleep Acoustics</p>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Vol. 3</p>
                <p class="text-[10px] font-bold uppercase tracking-widest text-gray-500">Native Media Routing</p>
            </div>
        </header>

        <!-- Visualizer Area -->
        <section id="visualizer-container" class="grid-cell">
            <canvas id="visualizer"></canvas>
            <div class="scanline"></div>
            
            <!-- Real-time readouts overlaid on canvas -->
            <div class="absolute top-4 left-4 pointer-events-none mix-blend-difference text-white">
                <p class="text-[10px] font-mono uppercase tracking-widest opacity-70">GRAPH / DESTINATION</p>
                <p id="status-readout" class="text-xs font-mono font-bold uppercase mt-1">IDLE</p>
            </div>
            <div class="absolute bottom-4 right-4 pointer-events-none mix-blend-difference text-white text-right">
                <p class="text-[10px] font-mono uppercase tracking-widest opacity-70">Output</p>
                <p id="track-readout" class="text-2xl sm:text-4xl font-black tracking-tighter uppercase mt-1">Silence</p>
            </div>
        </section>

        <!-- Controls Grid (Strict 3x3) -->
        <section class="grid grid-cols-3 gap-[2px] bg-[var(--border-color)] flex-1">
            
            <button class="grid-cell sound-btn" data-track="white">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">White</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Full Spectrum</span>
            </button>
            
            <button class="grid-cell sound-btn" data-track="pink">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Pink</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Balanced 1/F</span>
            </button>
            
            <button class="grid-cell sound-btn" data-track="brown">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Brown</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Deep 1/F^2</span>
            </button>

            <button class="grid-cell sound-btn" data-track="ocean">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Ocean</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Low Oscillation</span>
            </button>

            <button class="grid-cell sound-btn" data-track="rain">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Rain</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Filtered Pink</span>
            </button>
            
            <button class="grid-cell sound-btn" data-track="fireplace">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Fireplace</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Roar + Crackle</span>
            </button>
            
            <button class="grid-cell sound-btn" data-track="cabin">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Cabin</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">150Hz Resonant</span>
            </button>

            <button class="grid-cell sound-btn" data-track="night">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Night</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Sparse Organic</span>
            </button>

            <!-- Master Stop Button -->
            <button id="master-stop-btn" class="grid-cell stop-btn sound-btn">
                <span class="text-lg sm:text-2xl md:text-3xl font-black tracking-tighter uppercase">Off</span>
                <span class="text-[8px] sm:text-[10px] font-bold uppercase tracking-widest mt-4 opacity-60">Halt Stream</span>
            </button>

        </section>
    </main>

    <!-- CRITICAL: Native HTML Audio Element attached to the Web Audio MediaStream -->
    <audio id="native-audio" loop playsinline></audio>

    <script>
        let audioCtx;
        let masterGain;
        let analyzer;
        let mediaStreamDest;
        
        let activeNodes = []; // Track active nodes for teardown
        let isPlaying = false;
        let currentTrackId = null;
        let animationId;

        const noiseBuffers = {};
        const BUFFER_DUR = 5.0; // 5 seconds of seamless mathematical noise

        const trackLabels = {
            'white': 'White Noise',
            'pink': 'Pink Noise',
            'brown': 'Brown Noise',
            'ocean': 'Ocean Waves',
            'rain': 'Heavy Rain',
            'fireplace': 'Fireplace',
            'cabin': 'Airplane Cabin',
            'night': 'Nighttime Field'
        };

        // DOM Elements
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const trackReadout = document.getElementById('track-readout');
        const statusReadout = document.getElementById('status-readout');
        const soundButtons = document.querySelectorAll('.sound-btn[data-track]');
        const stopBtn = document.getElementById('master-stop-btn');
        const nativeAudio = document.getElementById('native-audio');

        function resizeCanvas() {
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = container.clientWidth * dpr;
            canvas.height = container.clientHeight * dpr;
            canvasCtx.scale(dpr, dpr);
            if (!isPlaying && !animationId) renderIdleCanvas();
        }
        window.addEventListener('resize', resizeCanvas);

        function initAudioEngine() {
            if (audioCtx) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            // CRITICAL FIX: Route audio to a MediaStreamDestination Node
            // This tricks iOS/Android into seeing native media, allowing lock screen play.
            mediaStreamDest = audioCtx.createMediaStreamDestination();
            nativeAudio.srcObject = mediaStreamDest.stream;
            
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0; // Start silenced
            
            analyzer = audioCtx.createAnalyser();
            analyzer.fftSize = 2048;
            analyzer.smoothingTimeConstant = 0.8;
            
            // Graph: MasterGain -> Analyzer -> MediaStreamDestination (NOT audioCtx.destination)
            masterGain.connect(analyzer);
            analyzer.connect(mediaStreamDest);

            generateCoreNoiseBuffers();
        }

        function generateCoreNoiseBuffers() {
            const sampleRate = audioCtx.sampleRate;
            const bufferSize = sampleRate * BUFFER_DUR;
            
            // 1. WHITE NOISE
            const whiteBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const whiteData = whiteBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                whiteData[i] = Math.random() * 2 - 1;
            }
            noiseBuffers['white'] = whiteBuffer;

            // 2. PINK NOISE (Paul Kellet's method)
            const pinkBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const pinkData = pinkBuffer.getChannelData(0);
            let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                pinkData[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                pinkData[i] *= 0.11; 
                b6 = white * 0.115926;
            }
            noiseBuffers['pink'] = pinkBuffer;

            // 3. BROWN NOISE (Integration)
            const brownBuffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const brownData = brownBuffer.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < bufferSize; i++) {
                let white = Math.random() * 2 - 1;
                brownData[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = brownData[i];
                brownData[i] *= 3.5; 
            }
            noiseBuffers['brown'] = brownBuffer;
        }

        function stopAndClearNodes() {
            activeNodes.forEach(node => {
                try {
                    if (node.stop) node.stop();
                    node.disconnect();
                } catch(e) {}
            });
            activeNodes = [];
        }

        function getBufferSource(type) {
            const src = audioCtx.createBufferSource();
            src.buffer = noiseBuffers[type];
            src.loop = true;
            activeNodes.push(src);
            return src;
        }

        function buildSoundPatch(trackId) {
            stopAndClearNodes();
            statusReadout.textContent = `COMPILING: ${trackId.toUpperCase()}...`;

            if (trackId === 'white' || trackId === 'pink' || trackId === 'brown') {
                const src = getBufferSource(trackId);
                src.connect(masterGain);
                src.start();
                statusReadout.textContent = `BUFFER [${trackId.toUpperCase()}] -> MEDIA_STREAM`;
            } 
            
            else if (trackId === 'ocean') {
                const src = getBufferSource('brown');
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 400;
                
                const swell = audioCtx.createGain();
                swell.gain.value = 0.4; 
                
                const lfo = audioCtx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.06; // Very slow 16s ocean swell
                activeNodes.push(lfo);

                const lfoDepth = audioCtx.createGain();
                lfoDepth.gain.value = 0.6; 

                lfo.connect(lfoDepth).connect(swell.gain);
                src.connect(filter).connect(swell).connect(masterGain);

                lfo.start();
                src.start();
                statusReadout.textContent = `BROWN -> LPF(400) -> VCA(LFO:0.06Hz)`;
            }

            else if (trackId === 'rain') {
                // Pink noise heavily filtered to sound like rain hiss
                const src = getBufferSource('pink');
                
                const bandpass = audioCtx.createBiquadFilter();
                bandpass.type = 'peaking';
                bandpass.frequency.value = 1200;
                bandpass.Q.value = 0.5;
                bandpass.gain.value = 10;
                
                const highpass = audioCtx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 300;

                src.connect(bandpass).connect(highpass).connect(masterGain);
                src.start();
                statusReadout.textContent = `PINK -> PEAK(1.2k) -> HPF(300)`;
            }

            else if (trackId === 'fireplace') {
                // Deep low roar
                const roarSrc = getBufferSource('brown');
                const roarFilter = audioCtx.createBiquadFilter();
                roarFilter.type = 'lowpass';
                roarFilter.frequency.value = 150; 
                const roarGain = audioCtx.createGain();
                roarGain.gain.value = 2.0; 
                
                roarSrc.connect(roarFilter).connect(roarGain).connect(masterGain);
                roarSrc.start();

                // Algorithmic Crackles
                let crackleTimer;
                const scheduleCrackle = () => {
                    if (!isPlaying || currentTrackId !== 'fireplace') return;
                    
                    const now = audioCtx.currentTime;
                    const burstSrc = audioCtx.createBufferSource();
                    burstSrc.buffer = noiseBuffers['white'];
                    
                    const bpFilter = audioCtx.createBiquadFilter();
                    bpFilter.type = 'bandpass';
                    bpFilter.frequency.value = 3000 + Math.random() * 2000;
                    bpFilter.Q.value = 1.0;

                    const env = audioCtx.createGain();
                    env.gain.setValueAtTime(0, now);
                    env.gain.linearRampToValueAtTime(1.0 + Math.random(), now + 0.005); 
                    env.gain.exponentialRampToValueAtTime(0.001, now + 0.05 + Math.random() * 0.1); 

                    burstSrc.connect(bpFilter).connect(env).connect(masterGain);
                    burstSrc.start(now);
                    burstSrc.stop(now + 0.2); 
                    
                    crackleTimer = setTimeout(scheduleCrackle, 100 + Math.random() * 800);
                };
                scheduleCrackle();
                
                activeNodes.push({
                    stop: () => clearTimeout(crackleTimer),
                    disconnect: () => {}
                });

                statusReadout.textContent = `BROWN(LPF150) + RND_WHITE_IMPULSE`;
            }

            else if (trackId === 'cabin') {
                // Deep resonant engine
                const droneSrc = getBufferSource('brown');
                const droneFilter = audioCtx.createBiquadFilter();
                droneFilter.type = 'lowpass';
                droneFilter.frequency.value = 150;
                droneFilter.Q.value = 3.5; // High resonance
                const droneGain = audioCtx.createGain();
                droneGain.gain.value = 2.0;
                
                droneSrc.connect(droneFilter).connect(droneGain).connect(masterGain);
                droneSrc.start();

                // AC Hiss
                const hissSrc = getBufferSource('pink');
                const hissFilter = audioCtx.createBiquadFilter();
                hissFilter.type = 'highpass';
                hissFilter.frequency.value = 4500;
                const hissGain = audioCtx.createGain();
                hissGain.gain.value = 0.15; 
                
                hissSrc.connect(hissFilter).connect(hissGain).connect(masterGain);
                hissSrc.start();

                statusReadout.textContent = `BROWN(LPF150/Q3.5) + PINK(HPF4.5k)`;
            }

            else if (trackId === 'night') {
                // Muted ambient breeze
                const windSrc = getBufferSource('pink');
                const windFilter = audioCtx.createBiquadFilter();
                windFilter.type = 'lowpass';
                windFilter.frequency.value = 300; 
                
                const windGain = audioCtx.createGain();
                windGain.gain.value = 0.5; 
                
                windSrc.connect(windFilter).connect(windGain).connect(masterGain);
                windSrc.start();

                // Extremely sparse, soft crickets via Amplitude Modulation
                let cricketTimer;
                const scheduleCricket = () => {
                    if (!isPlaying || currentTrackId !== 'night') return;
                    
                    const now = audioCtx.currentTime;
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = 4000 + Math.random() * 500; 
                    
                    const trillLfo = audioCtx.createOscillator();
                    trillLfo.type = 'sine';
                    trillLfo.frequency.value = 30 + Math.random() * 10; 
                    
                    const trillGain = audioCtx.createGain();
                    
                    const env = audioCtx.createGain();
                    env.gain.setValueAtTime(0, now);
                    env.gain.linearRampToValueAtTime(0.01, now + 1.5); // Very soft fade in
                    env.gain.linearRampToValueAtTime(0, now + 3.0); 

                    trillLfo.connect(trillGain.gain);
                    osc.connect(trillGain).connect(env).connect(masterGain);
                    
                    osc.start(now);
                    trillLfo.start(now);
                    
                    osc.stop(now + 4);
                    trillLfo.stop(now + 4);

                    cricketTimer = setTimeout(scheduleCricket, 4000 + Math.random() * 8000); // 4-12 sec gap
                };
                scheduleCricket();
                
                activeNodes.push({
                    stop: () => clearTimeout(cricketTimer),
                    disconnect: () => {}
                });

                statusReadout.textContent = `PINK(LPF300) + SPARSE_AM_SINE`;
            }
        }

        function playAudio(trackId) {
            initAudioEngine();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            currentTrackId = trackId;
            isPlaying = true;

            buildSoundPatch(trackId);

            // Cross-fade in
            masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
            masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
            masterGain.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.5);
            
            // Start the native HTML audio element (crucial for lock-screen play)
            nativeAudio.play().catch(e => console.log("Native playback pending interaction", e));
            
            // Media Session API 
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: trackLabels[trackId],
                    artist: 'Nocturne Synthesis',
                    album: 'Swiss Sleep Audio',
                });
                navigator.mediaSession.setActionHandler('play', () => playAudio(currentTrackId));
                navigator.mediaSession.setActionHandler('pause', stopAudio);
            }

            updateUI();
            if (!animationId) drawVisualizer();
        }

        function stopAudio() {
            if (!isPlaying) return;
            isPlaying = false;
            currentTrackId = null;

            if (audioCtx) {
                masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
                masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
                masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                
                setTimeout(() => {
                    if (!isPlaying) stopAndClearNodes();
                }, 350);
            }

            nativeAudio.pause();
            updateUI();
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            renderIdleCanvas();
        }

        function updateUI() {
            soundButtons.forEach(btn => {
                if (btn.dataset.track === currentTrackId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (currentTrackId) {
                trackReadout.textContent = trackLabels[currentTrackId];
            } else {
                trackReadout.textContent = 'Silence';
                statusReadout.textContent = 'SYSTEM IDLE / AUDIO STOPPED';
            }
        }

        function drawVisualizer() {
            if (!analyzer || !isPlaying) return;
            
            animationId = requestAnimationFrame(drawVisualizer);
            
            const bufferLength = analyzer.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyzer.getByteTimeDomainData(dataArray);

            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);

            canvasCtx.clearRect(0, 0, width, height);

            // Draw center grid line
            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = 'rgba(17,17,17,0.1)';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, height/2);
            canvasCtx.lineTo(width, height/2);
            canvasCtx.stroke();

            // Draw Waveform 
            canvasCtx.lineWidth = 1.5;
            canvasCtx.strokeStyle = '#111111';
            canvasCtx.beginPath();

            const sliceWidth = width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0; 
                const adjustedV = 1 + (v - 1) * 0.9; // Slight compression
                const y = adjustedV * height / 2;

                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);

                x += sliceWidth;
            }
            canvasCtx.stroke();
        }

        function renderIdleCanvas() {
            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);
            
            canvasCtx.clearRect(0, 0, width, height);
            canvasCtx.lineWidth = 1;
            canvasCtx.strokeStyle = 'rgba(17,17,17,0.3)';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, height/2);
            canvasCtx.lineTo(width, height/2);
            canvasCtx.stroke();
        }

        soundButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const track = btn.dataset.track;
                if (currentTrackId === track) {
                    stopAudio(); 
                } else {
                    playAudio(track);
                }
            });
        });

        stopBtn.addEventListener('click', stopAudio);
        
        // Initial setup
        resizeCanvas();

    </script>
</body>
</html>
